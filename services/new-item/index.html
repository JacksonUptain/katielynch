 \u003cparagraph\u003eAdvanced stylistic techniques and several literary devices will be taught, and students will be expected to incorporate them into their own writing. \u003cparagraph\u003eVolume 2: Aslan's Country centers on the last four novels in The Chronicles of Narnia series: Prince Caspian, The Voyage of the Dawn Treader, The Silver Chair, and The Last Battle. \u003cparagraph\u003eStudents who are not familiar with the first three books in the Narnia series should read or listen to them over the summer.  \u003cgrade-level\u003e9th–11th grade students with IEW experience  \u003cschedule\u003eTuesdays at 10:00–11:00 EST  \u003cprice\u003e$500  \u003cmaterial\u003e \u003cbullet\u003e\u003clink to=https://iew.com/following-narnia-volume-2-aslans-country-student-book-only\u003eFollowing Narnia Volume 2: Aslan's Country Student Book\u003cbullet\u003eThe last four novels in the Chronicles of Narnia series: Prince Caspian, The Voyage of the Dawn Treader, The Silver Chair, and The Last Battle \u003cbullet\u003eThesaurus, such as The American Heritage Desk Dictionary and Thesaurus \u003cbullet\u003eHighlighters \u003cbullet\u003ePencils and pens  \u003cclass-format\u003e \u003cparagraph\u003eStudents meet once a week for a live, virtual writing class that is interactive and engaging. \u003cparagraph\u003eClasses are capped at ten students, giving students opportunities to participate in discussions, ask questions, and share ideas. \u003cparagraph\u003eDuring class time, students review past concepts, discuss the new lesson, complete KWOs, and, when time permits, play review games.  \u003chomework\u003e \u003cparagraph\u003eStudents complete a weekly assignment and submit it before the following class. \u003cparagraph\u003eAfter each class, the weekly assignment will be emailed and broken into daily tasks to help students plan and manage the workload. Parents or older siblings will need to help edit the student’s rough drafts before final submission.  \u003cfeedback\u003e \u003cparagraph\u003eWritten assignments will be evaluated with personal feedback in a timely manner. Parents or older siblings will need to help edit the student’s rough drafts before final submission. \u003cparagraph\u003eAny assignment that does not earn a 100% may be resubmitted. \u003cgrading\u003e \u003cparagraph\u003eGrades will be distributed per semester and will be based on points earned from weekly assignments and class participation. \u003cpolicies\u003e \u003cparagraph\u003e Tuition can be paid through Zelle, Venmo, or personal check.  Full or ½ payment is due by August 1st and full payment is due by January 15th. Students are responsible for purchasing the necessary materials."])</script><script>self.__next_f.push([1,"13:Tab9,"])</script><script>self.__next_f.push([1,"\u003cdescription\u003e \u003cparagraph\u003eThis course is designed for students in 6th–8th grade, whether they are new to IEW or already have IEW experience. \u003cparagraph\u003eThrough fun and methodical lessons centered on a variety of topics, such as Socrates, the Amazon Rainforest, and the Dead Sea, students will build a strong foundation in IEW Style and Structure writing. \u003cparagraph\u003eStudents will develop their understanding of stylistic techniques and how to use them effectively in their own writing. \u003cparagraph\u003eThe class will work through IEW Units 1–9, covering note taking, inventive writing, reports, research papers, and MLA documentation.  \u003cgrade-level\u003e6th–8th grade students, new to IEW or with IEW experience \u003cschedule\u003eTuesdays at 12:45–2:00 EST \u003cprice\u003e$500  \u003cmaterial\u003e \u003cbullet\u003e\u003clink to=https://iew.com/investigations-in-writing-student-book-only\u003eInvestigations in Writing Student Book \u003cbullet\u003eThesaurus, such as The American Heritage Desk Dictionary and Thesaurus \u003cbullet\u003eHighlighters \u003cbullet\u003ePencils and pens\u003cclass-format\u003e \u003cparagraph\u003eStudents come together for a live, virtual writing class that is interactive and engaging. \u003cparagraph\u003eClass sizes do not exceed ten students, allowing each student the opportunity to participate in discussions, ask questions, and share ideas. \u003cparagraph\u003eDuring class time, students review past concepts, discuss the new lesson, complete key word outlines, and, when time permits, play review games.  \u003chomework\u003e \u003cparagraph\u003eStudents are expected to complete a weekly assignment and submit it before the following class. \u003cparagraph\u003eAfter each class, the week’s assignment will be emailed to students and families. The weekly assignment will be broken into daily tasks to help students plan ahead and manage the workload throughout the week. A parent or an older sibling will need to help edit the student’s rough drafts before final submission.  \u003cfeedback\u003e \u003cparagraph\u003eWritten assignments will be evaluated, and students will receive personal feedback in a timely manner. Any assignment that does not earn a 100% may be resubmitted.\u003cparagraph\u003e \u003cvocabulary\u003e \u003cparagraph\u003eVocabulary will be emphasized throughout the course. \u003cparagraph\u003eStudents will be asked to incorporate vocabulary words into their weekly compositions, and students will take four or five vocabulary quizzes throughout the year.  \u003cgrading\u003e \u003cparagraph\u003eGrades will be distributed each semester. \u003cparagraph\u003eGrades will be based on points earned from weekly assignments, vocabulary quizzes, and class participation.  \u003cpolicies\u003e \u003cparagraph\u003e Tuition can be paid through Zelle, Venmo, or personal check.  Full or ½ payment is due by August 1st and full payment is due by January 15th. Students are responsible for purchasing the necessary materials."])</script><script>self.__next_f.push([1,"6:[\"$\",\"$L11\",null,{\"routeService\":\"new-item\",\"initialServices\":[{\"id\":\"Dyslexia and Dysgraph
